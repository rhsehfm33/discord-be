services:
  mongodb:
    image: mongo:8.0
    container_name: discord-mongodb
    command: ["mongod", "--replSet", "rs0", "--port", "27018", "--bind_ip_all"]
    ports:
      - "27018:27018"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: >-
        mongosh --port 27018 --quiet --eval '
          try {
            rs.status()
          } catch (e) {
            rs.initiate({
              _id: "rs0",
              members: [{ _id: 0, host: "localhost:27018" }]
            })
          }
          db.hello().isWritablePrimary
        ' | grep true
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: discord-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  mongodb-data:

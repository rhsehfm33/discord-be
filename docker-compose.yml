services:
  mongodb:
    image: mongo:8.0
    container_name: discord-mongodb
    command: ["mongod", "--replSet", "rs0", "--port", "27018", "--bind_ip_all"]
    ports:
      - "27018:27018"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: >-
        mongosh --port 27018 --quiet --eval '
          try {
            rs.status()
          } catch (e) {
            rs.initiate({
              _id: "rs0",
              members: [{ _id: 0, host: "localhost:27018" }]
            })
          }
          db.hello().isWritablePrimary
        ' | grep true
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis-cluster:
    image: redis:7.4-alpine
    container_name: discord-redis-cluster
    command: ["sh", "-c", "
      for port in 7000 7001 7002; do
        mkdir -p /data/$$port;
        redis-server --port $$port --cluster-enabled yes
          --cluster-config-file /data/$$port/nodes.conf
          --cluster-announce-ip 127.0.0.1
          --cluster-announce-hostname localhost
          --cluster-preferred-endpoint-type hostname
          --appendonly yes --dir /data/$$port &
      done;
      for port in 7000 7001 7002; do
        until redis-cli -p $$port ping | grep -q PONG; do sleep 1; done;
      done;
      if redis-cli -p 7000 cluster info | grep -q 'cluster_slots_assigned:0'; then
        redis-cli --cluster create 127.0.0.1:7000 127.0.0.1:7001 127.0.0.1:7002
          --cluster-replicas 0 --cluster-yes;
      fi;
      wait
    "]
    ports: ["7000:7000", "7001:7001", "7002:7002"]
    volumes: [redis-cluster-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 7000 cluster info | grep -q 'cluster_state:ok'"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  mongodb-data:
  redis-cluster-data:

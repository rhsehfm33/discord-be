# Swagger
springdoc.swagger-ui.path=/api-doc

# MongoDB
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27018
spring.data.mongodb.database=test-discord
spring.data.mongodb.replica-set-name=rs0
spring.data.mongodb.auto-index-creation=true

# Session cookie configuration
server.servlet.session.cookie.domain=msdiscord.site

# Security
jwk-set-uri=http://localhost:8080/oauth2/jwks
internal.oauth.token-uri=http://localhost:8080/oauth2/token
internal.oauth.client-id=test-chat-gateway
internal.oauth.client-secret=test-gateway-secret
internal.chat-api.base-url=http://localhost:8080
internal.chat-message.base-url=http://localhost:8082

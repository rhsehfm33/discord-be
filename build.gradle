plugins {
	id 'java'
	id 'org.springframework.boot' version '3.1.5' // 필요시
	id 'io.spring.dependency-management' version '1.1.3' // 필요시
}

java {
	sourceCompatibility = '17'
}

repositories {
	mavenCentral()
}

subprojects {
	// 공통 그룹 및 버전 설정
	group = 'discord'
	version = '0.0.1-SNAPSHOT'

	apply plugin: 'java'
	apply plugin: 'org.springframework.boot'
	apply plugin: 'io.spring.dependency-management'

	java {
		sourceCompatibility = '17'
	}

	repositories {
		mavenCentral()
	}
}

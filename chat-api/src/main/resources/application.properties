spring.application.name=chat-api
messaging.redis.chat-room-message-topic=${REDIS_CHAT_ROOM_MESSAGE_TOPIC:${REDIS_TOPIC_PREFIX}}
messaging.redis.chat-room-session-topic=${REDIS_CHAT_ROOM_SESSION_TOPIC}
messaging.redis.direct-message-topic=${REDIS_DIRECT_MESSAGE_TOPIC}
spring.data.redis.timeout=5s
internal.oauth.token-uri=${INTERNAL_OAUTH_TOKEN_URI}
internal.oauth.client-id=${MESSAGE_CLIENT_ID}
internal.oauth.client-secret=${MESSAGE_CLIENT_SECRET}
internal.user-api.base-url=${USER_API_BASE_URL:${CHAT_API_BASE_URL}}

# Swagger
springdoc.swagger-ui.path=/api-doc

# MongoDB
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27018
spring.data.mongodb.database=test-discord
spring.data.mongodb.replica-set-name=rs0
spring.data.mongodb.auto-index-creation=true

# Session cookie configuration
server.servlet.session.cookie.domain=msdiscord.site

# Security
jwk-set-uri=http://localhost:8080/oauth2/jwks
jwt.key-id=ms-discord
jwt.issuer=ms-discord-auth-server
jwt.audience=ms-discord-resource-server
jwt.expiration-seconds=3600
domain-name=msdiscord.site
internal.message.client-id=test-chat-message
internal.message.client-secret=test-message-secret
internal.oauth.issuer=http://localhost:8080
